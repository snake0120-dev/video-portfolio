<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube EDITER — 천우태 포트폴리오</title>
<meta name="description" content="쿠키런 혀니수혀니 채널 롱폼 · 숏폼 영상 편집">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="YouTube EDITER — 천우태">
<meta property="og:description" content="쿠키런 혀니수혀니 채널 롱폼 · 숏폼 영상 편집">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="detail deck">

<a class="btn back" href="index.html" data-transition aria-label="홈으로 돌아가기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5M11 18l-6-6 6-6"/>
  </svg>
  HOME
</a>

<div class="deck" id="deck">
  <div class="frame">

    <!-- 1장 · 롱폼 -->
    <div class="sheet-fade is-on" data-sheet>
      <img src="assets/img/y-01.webp" width="1920" height="1080"
           alt="롱폼 영상 네 편" decoding="async" fetchpriority="high">

      <a class="tile tile--long ln-1" href="https://www.youtube.com/watch?v=tZqTGkilLVc"
         target="_blank" rel="noopener noreferrer" aria-label="바리공주 신보물 조합 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>

      <a class="tile tile--long ln-2" href="https://www.youtube.com/watch?v=RnKpsr_nrLs"
         target="_blank" rel="noopener noreferrer" aria-label="10년만에 재등장한 이벤트, 나 vs 나 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>

      <a class="tile tile--long ln-3" href="https://www.youtube.com/watch?v=oPEXrYCqBtE"
         target="_blank" rel="noopener noreferrer" aria-label="키위맛 쿠키 떡상 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>

      <a class="tile tile--long ln-4" href="https://www.youtube.com/watch?v=wdRmzaSKU34"
         target="_blank" rel="noopener noreferrer" aria-label="역대급 레전드 조합 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>
    </div>

    <!-- 2장 · 숏폼 -->
    <div class="sheet-fade" data-sheet>
      <img src="assets/img/y-02.webp" width="1920" height="1080"
           alt="숏폼 영상 세 편" decoding="async">

      <a class="tile tile--short sh-1" href="https://www.youtube.com/shorts/yJa4ezgwMyo"
         target="_blank" rel="noopener noreferrer" aria-label="쿠키런 레전드 14단 발악 점프 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>

      <a class="tile tile--short sh-2" href="https://www.youtube.com/shorts/bGyGLqVB2Bw"
         target="_blank" rel="noopener noreferrer" aria-label="쿠키런에도 초전도체 춤 등장 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>

      <a class="tile tile--short sh-3" href="https://www.youtube.com/shorts/ZjrlmlLhIfo"
         target="_blank" rel="noopener noreferrer" aria-label="부활 한번에 5000만점 — 유튜브에서 보기 (새 창)">
        <span class="tile__veil"></span>
        <span class="tile__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </a>
    </div>

    <!-- 상단 탭 — 그림에 찍힌 버튼 자리에 그대로 얹는다 -->
    <button class="yt-tab yt-tab--long" type="button" data-go="0"
            aria-pressed="true"><span>LONG-FORM VIDEO</span></button>
    <button class="yt-tab yt-tab--short" type="button" data-go="1"
            aria-pressed="false"><span>SHORT-FORM VIDEO</span></button>

  </div>
</div>

<div class="fade-layer"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
